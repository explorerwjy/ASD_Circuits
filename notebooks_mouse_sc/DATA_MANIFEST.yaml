# DATA_MANIFEST.yaml — notebooks_mouse_sc/ pipeline (Notebooks 01–07)
#
# Documents all data files needed to run the single-cell (cell-type) analysis pipeline.
# Paths are relative to the project root unless noted otherwise.
#
# Status labels:
#   SELF-CONTAINED: Produced by a notebook or script in this project
#   EXTERNAL:       Must be obtained from an external source
#   PIPELINE:       Produced by a Snakemake pipeline in this project
#   SHARED:         Also used by notebooks_mouse_str/ (documented in project-level DATA_MANIFEST.yaml)

# ==============================================================================
# NOTEBOOK 01: Preprocessing (cluster Z1 → Z2)
# ==============================================================================

01_Preprocessing:
  inputs:
    dat/SC_UMI_Mats/cluster_MeanLogUMI.csv:
      config_key: data_files.cluster_mean_log_umi_csv
      description: "Cluster-level mean log2(UMI+1) expression matrix"
      format: "CSV (17,938 genes × 5,312 clusters)"
      status: SELF-CONTAINED
      produced_by: "scripts/build_celltype_z2_matrix.py --stage1"
      source: "Allen Brain Cell Atlas — aggregated from 5,312 cluster GeneXCell UMI CSVs"
      size_approx: "800 MB"
      notes: "Input CSVs at /mnt/data0/Allen_Mouse_Brain_Cell_Atlas/Cluster_GeneXCell_UMI/ (external). Once this file is built, external data is no longer needed."

    dat/allen-mouse-exp/ExpMatch/:
      config_key: data_files.ish_match_dir
      description: "Per-gene ISH expression-matched gene lists (10,000 samples w/ replacement, ±5% quantile window)"
      format: "Plain text CSV, one Entrez gene ID per line (17,189 files)"
      status: EXTERNAL (legacy)
      source: "Generated by legacy pipeline. Symlink to /home/jw3514/Work/ASD_Circuits/dat/genes/ExpMatch_RootExp_uniform_kernal/"
      size_approx: "1.5 GB total"
      notes: "Z2 uses ALL entries including duplicates for frequency-weighted mean/std. Fresh matches with different seeds give different Z2 results. Must use these legacy files for exact reproduction."

  outputs:
    dat/BiasMatrices/Cluster_Z2Mat_ISHMatch.z1clip3.parquet:
      config_key: analysis_types.CT_Z2.expr_matrix
      description: "Z2 expression specificity matrix for cell-type clusters"
      format: "Parquet (16,916 genes × 5,312 clusters)"
      size_approx: "892 MB"
      used_by: ["02.Cell_Type_Bias"]

# ==============================================================================
# NOTEBOOK 02: Cell-Type Bias (DN weights, ASD/DDD bias computation)
# ==============================================================================

02_Cell_Type_Bias:
  inputs:
    dat/ExpressionMats/Subclass_V2_ExpMat_CPM.csv:
      config_key: data_files.subclass_v2_exp
      description: "Subclass-level expression matrix, 10x Chromium V2 chemistry"
      format: "CSV (17,938 genes × 284 subclasses), log2(CPM+1)"
      status: SELF-CONTAINED
      produced_by: "scripts/build_subclass_expmat_cpm.py"
      source: "Allen Brain Cell Atlas h5ad files (10x V2 library)"
      size_approx: "65 MB"
      notes: "Reads cached; only needed if correlation cache is missing."

    dat/ExpressionMats/Subclass_V3_ExpMat_CPM.csv:
      config_key: data_files.subclass_v3_exp
      description: "Subclass-level expression matrix, 10x Chromium V3 chemistry"
      format: "CSV (17,938 genes × 334 subclasses), log2(CPM+1)"
      status: SELF-CONTAINED
      produced_by: "scripts/build_subclass_expmat_cpm.py"
      source: "Allen Brain Cell Atlas h5ad files (10x V3 library)"
      size_approx: "75 MB"
      notes: "Reads cached; only needed if correlation cache is missing."

    dat/allen-mouse-exp/ExpressionMatrix_raw.parquet:
      config_key: data_files.ish_expression_matrix
      description: "ISH expression matrix — arithmetic mean of raw expression energy across ISH sections per gene"
      format: "Parquet (17,210 genes × 213 structures)"
      status: SELF-CONTAINED
      produced_by: "notebooks_mouse_str/01.Download_ISH_data (Section 9)"
      source: "Allen Brain Atlas ISH API"
      size_approx: "30 MB"
      notes: "Only needed if correlation cache is missing. Used for gene filtering (4-platform intersection), not for DN weight computation."

    dat/MERFISH/STR_Cell_Mean_DF.UMI.csv:
      config_key: data_files.merfish_cell_mean_umi
      description: "Allen MERFISH all-cell mean UMI expression per brain structure"
      format: "CSV (17,938 genes × 212 structures)"
      status: EXTERNAL
      source: "Allen Brain Cell Atlas MERFISH dataset — aggregated from raw cell-level data"
      produced_by: "scripts/build_merfish_umi_matrices.py"
      size_approx: "50 MB"
      notes: "Only needed if correlation cache is missing."

    dat/ISH_MERFISH_Gene_CorssSTR_Corr.v3.csv:
      config_key: data_files.gene_cross_platform_corr
      description: "Per-gene Spearman correlations: V2-V3 (subclass) and ISH-MERFISH (structure)"
      format: "CSV (16,935 genes, columns: Corr, Symbol, ISH_exp, MERFISH_exp, V2_V3_CT_Corr)"
      status: SELF-CONTAINED
      produced_by: "02.Cell_Type_Bias (Section 1, cached)"
      size_approx: "1.5 MB"
      notes: "Cached after first computation. V2_V3_CT_Corr is the critical column — used to compute DN weights."

    dat/Genetics/GeneWeights/Spark_Meta_EWS.gw:
      config_key: gene_sets.ASD_All.geneweights
      description: "ASD ISH gene weights (61 genes from DenovoWEST Stage 1+2)"
      format: "CSV, no header (EntrezID, weight)"
      status: SHARED
      produced_by: "notebooks_mouse_str/04.Weighted_ASD_bias"
      size_approx: "1 KB"

    dat/Genetics/GeneWeights/DDD.top237.ExcludeASD.gw:
      config_key: gene_sets.DDD_285_ExcludeASD.geneweights
      description: "DDD/NDD ISH gene weights (285 genes, excluding ASD overlap = 237)"
      format: "CSV, no header (EntrezID, weight)"
      status: SHARED
      produced_by: "notebooks_mouse_str/04.Weighted_ASD_bias"
      size_approx: "4 KB"

    dat/BiasMatrices/Cluster_Z2Mat_ISHMatch.z1clip3.parquet:
      config_key: analysis_types.CT_Z2.expr_matrix
      description: "Z2 expression specificity matrix (from notebook 01)"
      status: SELF-CONTAINED
      produced_by: "01.Preprocessing"

    dat/MouseCT_Cluster_Anno.csv:
      config_key: data_files.mouse_ct_annotation
      description: "Cluster metadata — class, subclass, supertype labels for 5,312 clusters"
      format: "CSV (index: cluster_id_label)"
      status: EXTERNAL
      source: "Allen Brain Cell Atlas cluster annotations"
      size_approx: "1 MB"

    dat/CellTypeHierarchy.csv:
      config_key: data_files.cell_type_hierarchy
      description: "Cell type hierarchy mapping (cluster → class → subclass)"
      format: "CSV"
      status: EXTERNAL
      source: "Allen Brain Cell Atlas taxonomy"
      size_approx: "500 KB"

    results/CT_Z2/ASD_All_bias_addP_sibling.csv:
      config_key: data_files.ct_bias_addp
      description: "Cell-type bias with sibling-null p-values (for validation)"
      status: PIPELINE
      produced_by: "Snakefile.bias + config/config.SC.DN.yaml"
      notes: "Read for validation only in notebook 02. Primary consumer is notebooks 05/06/07."

  outputs:
    dat/ISH_MERFISH_Gene_CorssSTR_Corr.v3.csv:
      description: "Cross-platform gene correlations (cached after first run)"

    dat/Genetics/GeneWeights_DN/Spark_Meta_EWS.GeneWeight.DN.gw:
      config_key: data_files.asd_gene_weights_dn
      description: "ASD DN gene weights: weight_DN = weight_ISH × max(Spearman_r_V2V3, 0)²"
      format: "CSV, no header (EntrezID, weight). 60 genes."
      used_by: ["04.MERFISH_Structure_Bias", "Snakefile.bias (CT_Z2)"]

    dat/Genetics/GeneWeights_DN/DDD.top237.ExcludeASD.DN.gw:
      config_key: data_files.ddd_gene_weights_dn
      description: "DDD DN gene weights. 204 genes."
      format: "CSV, no header (EntrezID, weight)"
      used_by: ["Snakefile.bias (CT_Z2)"]

    results/CT_Z2/ASD_Spark61_DN.csv:
      description: "ASD cell-type bias scores (5,312 clusters, with class/subclass annotations)"
      format: "CSV"

    results/CT_Z2/DDD_285_ExcludeASD_DN.csv:
      description: "DDD cell-type bias scores (5,312 clusters)"
      format: "CSV"

    results/cache/CT_permutation_residuals.npz:
      description: "Cached permutation test for residual analysis (1,000 perms)"
      format: "NPZ"
      notes: "Cached after first computation."

# ==============================================================================
# NOTEBOOK 03: MERFISH Preprocessing (ISH annotation, Z1, Z2, quantiles)
# ==============================================================================

03_MERFISH_Preprocessing:
  inputs:
    dat/MERFISH/CCF_V3_ISH_MERFISH.csv:
      config_key: data_files.merfish_ccf_ontology
      description: "CCF v3 ontology mapping MERFISH parcellation abbreviations to ISH structure names"
      format: "CSV (index: abbreviation)"
      status: EXTERNAL
      source: "Allen Brain Atlas CCF v3 ontology, manually curated"
      size_approx: "30 KB"

    dat/Unionize_bias/Spark_Meta_EWS.Z2.bias.FDR.csv:
      config_key: data_files.str_bias_fdr
      description: "ISH structure-level ASD bias with FDR (used to extract 213 ISH structure names)"
      format: "CSV (213 structures)"
      status: SHARED
      produced_by: "Snakefile.bias (STR_ISH)"

    dat/MERFISH/MERFISH.ISH_Annot.csv:
      config_key: data_files.merfish_annotation
      description: "MERFISH cell metadata with ISH structure annotations (~3.7M cells)"
      format: "CSV"
      status: SELF-CONTAINED
      produced_by: "scripts/build_merfish_annotation.py"
      source: "Allen Brain Cell Atlas MERFISH whole-brain dataset"
      size_approx: "2 GB"
      notes: "Converted to parquet on first load for faster subsequent reads."

    dat/MERFISH/MERFISH.ISH_Annot.parquet:
      config_key: data_files.merfish_annotation_parquet
      description: "Parquet version of MERFISH cell metadata (created from CSV on first load)"
      status: SELF-CONTAINED
      produced_by: "03.MERFISH_Preprocessing (Section 4, auto-cached)"
      size_approx: "400 MB"

    dat/MERFISH/STR_Cell_Mean_DF.UMI.csv:
      config_key: data_files.merfish_cell_mean_umi
      description: "Allen MERFISH all-cell mean UMI expression per structure"
      format: "CSV (17,938 genes × 212 structures)"
      status: EXTERNAL
      source: "Allen Brain Cell Atlas MERFISH dataset"
      produced_by: "scripts/build_merfish_umi_matrices.py"
      size_approx: "50 MB"

    dat/MERFISH/STR_Vol_Mean_DF.UMI.csv:
      config_key: data_files.merfish_vol_mean_umi
      description: "Allen MERFISH volume-weighted mean UMI expression per structure"
      format: "CSV (17,938 genes × 212 structures)"
      status: EXTERNAL
      source: "Allen Brain Cell Atlas MERFISH dataset"
      produced_by: "scripts/build_merfish_umi_matrices.py"
      size_approx: "50 MB"

    dat/MERFISH/STR_NEU_Mean_DF.UMI.csv:
      config_key: data_files.merfish_neur_mean_umi
      description: "Allen MERFISH neuron-only mean UMI expression per structure"
      format: "CSV (17,938 genes × 212 structures)"
      status: EXTERNAL
      source: "Allen Brain Cell Atlas MERFISH dataset"
      produced_by: "scripts/build_merfish_umi_matrices.py"
      size_approx: "50 MB"

    dat/MERFISH/STR_NEU_Vol_Mean_DF.UMI.csv:
      config_key: data_files.merfish_neur_vol_mean_umi
      description: "Allen MERFISH neuron-only volume-weighted mean UMI expression per structure"
      format: "CSV (17,938 genes × 212 structures)"
      status: EXTERNAL
      source: "Allen Brain Cell Atlas MERFISH dataset"
      produced_by: "scripts/build_merfish_umi_matrices.py"
      size_approx: "50 MB"

    dat/MERFISH_Zhuang/STR_Cell_Mean_DF.UMI.csv:
      config_key: data_files.merfish_zhuang_cell_mean_umi
      description: "Zhuang MERFISH cell-mean UMI expression (optional)"
      format: "CSV"
      status: EXTERNAL
      source: "Zhuang Lab MERFISH dataset"
      size_approx: "50 MB"
      notes: "Optional — skipped if file not found."

    dat/MERFISH_Zhuang/STR_Vol_Mean_DF.UMI.csv:
      config_key: data_files.merfish_zhuang_vol_mean_umi
      description: "Zhuang MERFISH volume-weighted mean UMI expression (optional)"
      format: "CSV"
      status: EXTERNAL
      source: "Zhuang Lab MERFISH dataset"
      size_approx: "50 MB"
      notes: "Optional — skipped if file not found."

    dat/allen-mouse-exp/ExpMatch/:
      config_key: data_files.ish_match_dir
      description: "Per-gene ISH expression-matched gene lists (shared with notebook 01)"
      status: EXTERNAL (legacy)
      notes: "Same files used by notebook 01."

    dat/allen-mouse-exp/ExpMatchFeatures.csv:
      description: "Per-gene expression features (rank, quantile) for expression matching"
      format: "CSV (index: Genes, columns: EXP, Rank, quantile)"
      status: SELF-CONTAINED
      produced_by: "notebooks_mouse_str/02.Preprocessing_ISH_data (Section 3)"
      size_approx: "500 KB"
      notes: "Not in config.yaml — hardcoded path."

    dat/SC_UMI_Mats/cluster_MeanLogUMI.csv:
      config_key: data_files.cluster_mean_log_umi_csv
      description: "Cluster expression matrix (used in Section 8 for MERFISH quantile computation)"
      status: SELF-CONTAINED
      notes: "Same file used by notebook 01."

  outputs:
    # Z1 matrices (Allen)
    dat/MERFISH/STR_Cell_Mean_Z1Mat.csv:
      description: "Allen MERFISH cell-mean Z1 matrix"
    dat/MERFISH/STR_Cell_Mean_Z1Mat.clip.csv:
      description: "Allen MERFISH cell-mean Z1, clipped ±5"
    dat/MERFISH/STR_Vol_Mean_Z1Mat.csv:
      description: "Allen MERFISH volume-mean Z1 matrix"
    dat/MERFISH/STR_Vol_Mean_Z1Mat.clip.csv:
      description: "Allen MERFISH volume-mean Z1, clipped ±5"
    dat/MERFISH/STR_NEU_Mean_Z1Mat.csv:
      description: "Allen MERFISH neuron-mean Z1 matrix"
    dat/MERFISH/STR_NEU_Mean_Z1Mat.clip.csv:
      description: "Allen MERFISH neuron-mean Z1, clipped ±5"
    dat/MERFISH/STR_NEU_Vol_Mean_Z1Mat.csv:
      description: "Allen MERFISH neuron volume-mean Z1 matrix"
    dat/MERFISH/STR_NEU_Vol_Mean_Z1Mat.clip.csv:
      description: "Allen MERFISH neuron volume-mean Z1, clipped ±5"

    # Z1 matrices (Zhuang, optional)
    dat/MERFISH_Zhuang/STR_Cell_Mean_Z1Mat.csv:
      description: "Zhuang MERFISH cell-mean Z1 (optional)"
    dat/MERFISH_Zhuang/STR_Vol_Mean_Z1Mat.csv:
      description: "Zhuang MERFISH volume-mean Z1 (optional)"
    dat/MERFISH_Zhuang/STR_Cell_Mean_Z1Mat.clip.csv:
      description: "Zhuang MERFISH cell-mean Z1, clipped ±5 (optional)"
    dat/MERFISH_Zhuang/STR_Vol_Mean_Z1Mat.clip.csv:
      description: "Zhuang MERFISH volume-mean Z1, clipped ±5 (optional)"

    # Z2 matrices (ISH expression-matched)
    dat/MERFISH/STR_Cell_Mean_Z2Mat_ISHMatch.csv:
      config_key: data_files.merfish_z2_cell_mean
      description: "Allen MERFISH cell-mean Z2 (ISH expression-matched)"
      used_by: ["04.MERFISH_Structure_Bias"]
    dat/MERFISH/STR_Vol_Mean_Z2Mat_ISHMatch.csv:
      config_key: data_files.merfish_z2_vol_mean
      description: "Allen MERFISH volume-mean Z2"
      used_by: ["04.MERFISH_Structure_Bias"]
    dat/MERFISH/STR_NEUR_Mean_Z2Mat_ISHMatch.csv:
      config_key: data_files.merfish_z2_neur_mean
      description: "Allen MERFISH neuron-mean Z2"
      used_by: ["04.MERFISH_Structure_Bias"]
    dat/MERFISH/STR_NEUR_Vol_Mean_Z2Mat_ISHMatch.csv:
      config_key: data_files.merfish_z2_neur_vol_mean
      description: "Allen MERFISH neuron volume-mean Z2"
      used_by: ["04.MERFISH_Structure_Bias"]
    dat/MERFISH_Zhuang/STR_Cell_Mean_Z2Mat_ISHMatch.csv:
      description: "Zhuang MERFISH cell-mean Z2 (optional)"
    dat/MERFISH_Zhuang/STR_Vol_Mean_Z2Mat_ISHMatch.csv:
      description: "Zhuang MERFISH volume-mean Z2 (optional)"

    # Quantile file
    dat/MERFISH/MouseMERFISHGeneMatchQuantile.csv:
      description: "Per-gene expression quantiles across MERFISH clusters (for expression matching)"
      format: "CSV"

# ==============================================================================
# NOTEBOOK 04: MERFISH Structure Bias (MERFISH-based ASD bias per structure)
# ==============================================================================

04_MERFISH_Structure_Bias:
  inputs:
    dat/MERFISH/STR_Cell_Mean_Z2Mat_ISHMatch.csv:
      config_key: data_files.merfish_z2_cell_mean
      status: SELF-CONTAINED
      produced_by: "03.MERFISH_Preprocessing"

    dat/MERFISH/STR_Vol_Mean_Z2Mat_ISHMatch.csv:
      config_key: data_files.merfish_z2_vol_mean
      status: SELF-CONTAINED
      produced_by: "03.MERFISH_Preprocessing"

    dat/MERFISH/STR_NEUR_Mean_Z2Mat_ISHMatch.csv:
      config_key: data_files.merfish_z2_neur_mean
      status: SELF-CONTAINED
      produced_by: "03.MERFISH_Preprocessing"

    dat/MERFISH/STR_NEUR_Vol_Mean_Z2Mat_ISHMatch.csv:
      config_key: data_files.merfish_z2_neur_vol_mean
      status: SELF-CONTAINED
      produced_by: "03.MERFISH_Preprocessing"

    dat/Genetics/GeneWeights_DN/Spark_Meta_EWS.GeneWeight.DN.gw:
      config_key: data_files.asd_gene_weights_dn
      status: SELF-CONTAINED
      produced_by: "02.Cell_Type_Bias"

    dat/Unionize_bias/Spark_Meta_EWS.Z2.bias.FDR.csv:
      config_key: data_files.str_bias_fdr
      description: "ISH structure-level ASD bias (for validation comparison)"
      status: SHARED
      produced_by: "Snakefile.bias (STR_ISH)"

  outputs:
    notebooks_mouse_sc/dat/Bias/STR/ASD.MERFISH_Allen.CM.ISHMatch.Z2.csv:
      description: "MERFISH Cell Mean structure-level ASD bias (r=0.75 vs ISH)"
      used_by: ["07.Figures"]
    notebooks_mouse_sc/dat/Bias/STR/ASD.MERFISH_Allen.VM.ISHMatch.Z2.csv:
      description: "MERFISH Volume Mean structure-level ASD bias"
    notebooks_mouse_sc/dat/Bias/STR/ASD.MERFISH_Allen.NM.ISHMatch.Z2.csv:
      description: "MERFISH Neuron Mean structure-level ASD bias"
    notebooks_mouse_sc/dat/Bias/STR/ASD.MERFISH_Allen.NVM.ISHMatch.Z2.csv:
      description: "MERFISH Neuron Volume Mean structure-level ASD bias"

# ==============================================================================
# SNAKEFILE.BIAS PIPELINE (between notebooks 04 and 05)
# ==============================================================================

Snakefile_bias_CT_Z2:
  description: "Sibling null permutation pipeline for cell-type bias p-values"
  command: "snakemake -s Snakefile.bias --configfile config/config.SC.DN.yaml --cores 10"
  inputs:
    dat/BiasMatrices/Cluster_Z2Mat_ISHMatch.z1clip3.parquet:
      status: SELF-CONTAINED
      produced_by: "01.Preprocessing"
    dat/Genetics/GeneWeights_DN/Spark_Meta_EWS.GeneWeight.DN.gw:
      status: SELF-CONTAINED
      produced_by: "02.Cell_Type_Bias"
    dat/Genetics/GeneWeights_DN/DDD.top237.ExcludeASD.DN.gw:
      status: SELF-CONTAINED
      produced_by: "02.Cell_Type_Bias"
    dat/Genetics/GeneWeights/sibling_weights_LGD_Dmis.csv:
      config_key: data_files.sibling_weights
      description: "Sibling unaffected mutation weights"
      status: EXTERNAL
      source: "Derived from SPARK sibling exome data"
      size_approx: "500 KB"
    dat/Genetics/GeneWeights/GeneProb_LGD_Dmis.csv:
      config_key: data_files.gene_prob
      description: "Per-gene mutation probabilities (15,402 genes)"
      status: EXTERNAL
      source: "Computed from mutation rate models"
      size_approx: "500 KB"
  outputs:
    results/CT_Z2/ASD_All_bias_addP_sibling.csv:
      config_key: data_files.ct_bias_addp
      description: "ASD cell-type bias with sibling-null p-values and FDR"
      format: "CSV (5,312 clusters, columns: EFFECT, P-value, Z-score, EFFECT_adj, q-value, -logP)"
      used_by: ["05.Bias_Controls", "06.Bias_Display", "07.Figures"]
    results/CT_Z2/ASD_All_bias_addP_random.csv:
      description: "ASD cell-type bias with random-null p-values"
    results/CT_Z2/DDD_285_ExcludeASD_bias_addP_sibling.csv:
      description: "DDD cell-type bias with sibling-null p-values"
    results/CT_Z2/DDD_285_ExcludeASD_bias_addP_random.csv:
      description: "DDD cell-type bias with random-null p-values"

# ==============================================================================
# NOTEBOOK 05: Bias Controls (QQ plots, sibling null visualization)
# ==============================================================================

05_Bias_Controls:
  inputs:
    results/CT_Z2/ASD_All_bias_addP_sibling.csv:
      config_key: data_files.ct_bias_addp
      status: PIPELINE
      produced_by: "Snakefile.bias + config/config.SC.DN.yaml"
  outputs: null  # Visualization only — no data outputs

# ==============================================================================
# NOTEBOOK 06: Bias Display (spatial visualization on MERFISH sections)
# ==============================================================================

06_Bias_Display:
  inputs:
    dat/MERFISH/MERFISH.ISH_Annot.parquet:
      config_key: data_files.merfish_annotation_parquet
      status: SELF-CONTAINED
      produced_by: "03.MERFISH_Preprocessing"
      notes: "Only read if cached annotated parquet does not exist."

    results/CT_Z2/ASD_All_bias_addP_sibling.csv:
      config_key: data_files.ct_bias_addp
      status: PIPELINE
      produced_by: "Snakefile.bias"
      notes: "Only read if cached annotated parquet does not exist."

  outputs:
    notebooks_mouse_sc/dat/MERFISH/MERFISH.cells.ASD.Bias.Anno.parquet:
      config_key: data_files.merfish_cells_bias_annotated
      description: "MERFISH cells annotated with ASD.Bias (raw) and ASD.Bias.adj (mean-adjusted)"
      format: "Parquet (~3.7M cells)"
      size_approx: "500 MB"
      used_by: ["07.Figures"]
      notes: "Cached — only regenerated if deleted."

# ==============================================================================
# NOTEBOOK 07: Figures (Figure 5 panels for manuscript)
# ==============================================================================

07_Figures:
  inputs:
    dat/Unionize_bias/Spark_Meta_EWS.Z2.bias.csv:
      config_key: data_files.str_bias_raw
      description: "ISH structure-level ASD bias (no FDR, for ISH-MERFISH scatter)"
      status: SHARED
      produced_by: "Snakefile.bias (STR_ISH)"

    notebooks_mouse_sc/dat/Bias/STR/ASD.MERFISH_Allen.CM.ISHMatch.Z2.csv:
      description: "MERFISH Cell Mean structure-level ASD bias"
      status: SELF-CONTAINED
      produced_by: "04.MERFISH_Structure_Bias"
      notes: "Hardcoded path (relative to notebooks_mouse_sc/ cwd)"

    results/STR_ISH/ASD.SA.Circuits.Size46.csv:
      config_key: data_files.asd_circuit_size46
      description: "ASD circuit structures (Size 46, SA Pareto front idx 3)"
      status: SHARED
      produced_by: "Snakefile.circuit"

    results/CT_Z2/ASD_All_bias_addP_sibling.csv:
      config_key: data_files.ct_bias_addp
      status: PIPELINE
      produced_by: "Snakefile.bias"

    dat/CellTypeHierarchy.csv:
      config_key: data_files.cell_type_hierarchy
      status: EXTERNAL
      source: "Allen Brain Cell Atlas taxonomy"

    notebooks_mouse_sc/dat/MERFISH/MERFISH.cells.ASD.Bias.Anno.parquet:
      config_key: data_files.merfish_cells_bias_annotated
      status: SELF-CONTAINED
      produced_by: "06.Bias_Display"

    dat/allen-mouse-conn/ConnectomeScoringMat/InfoMat.Ipsi.csv:
      config_key: data_files.infomat_ipsi
      description: "Shannon Information connectivity scoring matrix (ipsilateral, full distance)"
      format: "CSV (213 × 213)"
      status: SHARED
      produced_by: "notebooks_mouse_str/03.Preprocessing_Connectivity_data"

    dat/allen-mouse-conn/ConnectomeScoringMat/InfoMat.Ipsi.Short.3900.csv:
      config_key: data_files.infomat_ipsi_short
      description: "InfoMat for short-range connections (<3988 µm)"
